<ion-app>
  <ion-split-pane contentId="main-content">
    @if (auth.isLoggedIn()) {
      <ion-menu contentId="main-content" type="overlay">
        <ion-header>
          <ion-toolbar color="primary">
            <ion-buttons slot="start">
              <ion-menu-button></ion-menu-button>
            </ion-buttons>
            <ion-title>Título de la página</ion-title>
          </ion-toolbar>
        </ion-header>

        <ion-content>
          <nav aria-label="Navegación principal">
            <ion-list lines="none">
              <ion-menu-toggle autoHide="false">
                <ion-item button routerLink="/tareas" routerLinkActive="selected" detail="false">
                  <ion-icon aria-hidden="true" slot="start" name="list-outline"></ion-icon>
                  <ion-label>Mis tareas</ion-label>
                </ion-item>
              </ion-menu-toggle>
 
              @if (auth.isAdmin()) {
                <ion-menu-toggle autoHide="false">
                  <ion-item button routerLink="/dashboard" routerLinkActive="selected" detail="false">
                    <ion-icon aria-hidden="true" slot="start" name="stats-chart-outline"></ion-icon>
                    <ion-label>Dashboard</ion-label>
                  </ion-item>
                </ion-menu-toggle>
              }
 
              <ion-menu-toggle autoHide="false">
                <ion-item button routerLink="/ayuda" routerLinkActive="selected" detail="false">
                  <ion-icon aria-hidden="true" slot="start" name="help-circle-outline"></ion-icon>
                  <ion-label>Ayuda</ion-label>
                </ion-item>
              </ion-menu-toggle>
 
              <ion-menu-toggle autoHide="false">
                <ion-item button (click)="logout()" detail="false">
                  <ion-icon aria-hidden="true" slot="start" name="log-out-outline"></ion-icon>
                  <ion-label>Cerrar sesión ({{ auth.profile()?.full_name }})</ion-label>
                </ion-item>
              </ion-menu-toggle>
            </ion-list>
          </nav>
        </ion-content>
      </ion-menu>
    }
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
